{% extends "base.html" %}
{% block title %}登录 - Web Test1{% endblock %}
{% block content %}
<h1>登录</h1>
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
<form method="POST" action="{{ url_for('pages.login') }}" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>用户名 <input name="name" required autofocus></label>
  <label>密码 <input name="password" type="password" required></label>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">登录</button>
    <span>还没有账号？<a href="{{ url_for('pages.register') }}">立即注册</a></span>
  </div>
</form>
{% endblock %}
